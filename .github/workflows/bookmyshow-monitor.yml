name: BookMyShow Monitor

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run BookMyShow monitor
        env:
          BMS_EMAIL_SENDER: ${{ secrets.BMS_EMAIL_SENDER }}
          BMS_EMAIL_RECIPIENTS: ${{ secrets.BMS_EMAIL_RECIPIENTS }}
          BMS_GMAIL_APP_PASSWORD: ${{ secrets.BMS_GMAIL_APP_PASSWORD }}
        run: python main.py